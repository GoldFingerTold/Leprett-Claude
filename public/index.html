<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salones Leprett</title>
<meta name="description" content="Salones Leprett — Multiespacio para eventos sociales y corporativos en Monserrat, CABA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="#top" class="nav-brand" id="nav-brand">Salones Leprett</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="#top" data-nav-label="nav_home_label">Inicio</a></li>
      <li><a href="#nosotros" data-nav-label="nav_nosotros_label">Nosotros</a></li>
      <li><a href="#instalaciones" data-nav-label="nav_instalaciones_label">Instalaciones</a></li>
      <li><a href="#servicios" data-nav-label="nav_servicios_label">Servicios</a></li>
      <li><a href="#ubicacion" data-nav-label="nav_ubicacion_label">Ubicación</a></li>
      <li><a href="#contacto" data-nav-label="nav_contacto_label" class="nav-cta">Contacto</a></li>
    </ul>
  </div>
</nav>

<header class="hero" id="top">
  <div class="hero-media">
    <img id="banner-image" src="" alt="Salones Leprett" class="hero-img">
    <div class="hero-veil"></div>
  </div>
  <div class="hero-content">
    <p class="eyebrow">Multiespacio para eventos sociales y corporativos</p>
    <h1 id="banner-title" class="hero-title"></h1>
    <p id="banner-subtitle" class="hero-subtitle"></p>
    <a href="#contacto" class="btn btn-primary">Consultar disponibilidad</a>
  </div>
</header>

<main>

  <section id="nosotros" class="section">
    <div class="section-inner bio-grid">
      <div class="bio-photo">
        <img id="nosotros-image" src="" alt="Salones Leprett">
      </div>
      <div class="bio-copy">
        <p class="kicker" id="nosotros-subheading"></p>
        <h2 class="section-title" id="nosotros-heading"></h2>
        <div class="prose" id="nosotros-text"></div>
      </div>
    </div>
  </section>

  <section id="instalaciones" class="section section-alt">
    <div class="section-inner">
      <div class="section-header centered">
        <p class="kicker" id="instalaciones-subheading"></p>
        <h2 class="section-title" id="instalaciones-heading"></h2>
      </div>
      <ul class="salones-list" id="salones-list"></ul>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <section id="servicios" class="section">
    <div class="section-inner">
      <div class="section-header centered">
        <p class="kicker" id="servicios-subheading"></p>
        <h2 class="section-title" id="servicios-heading"></h2>
      </div>
      <div class="servicios-list" id="servicios-list"></div>
    </div>
  </section>

  <section id="ubicacion" class="section section-alt">
    <div class="section-inner ubicacion-grid">
      <div class="ubicacion-copy">
        <p class="kicker" id="ubicacion-subheading"></p>
        <h2 class="section-title" id="ubicacion-heading"></h2>
        <p class="section-text" id="ubicacion-text"></p>
        <p class="ubicacion-address" id="ubicacion-address"></p>
      </div>
      <div class="ubicacion-map">
        <img id="ubicacion-map-image" src="" alt="Mapa de Salones Leprett">
      </div>
    </div>
  </section>

  <section id="contacto" class="section">
    <div class="section-inner">
      <div class="section-header centered">
        <p class="kicker" id="contact-subheading"></p>
        <h2 class="section-title" id="contact-heading"></h2>
      </div>

      <form id="consulta-form" class="consulta-form" novalidate>
        <h3 class="form-subheading">Datos personales</h3>
        <div class="form-row">
          <div class="form-field">
            <label for="c-agasajado">Nombre del agasajado/Empresa *</label>
            <input type="text" id="c-agasajado" name="agasajado" required>
          </div>
          <div class="form-field">
            <label for="c-solicitante">Nombre y apellido del solicitante *</label>
            <input type="text" id="c-solicitante" name="solicitante" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="c-localidad">Localidad</label>
            <input type="text" id="c-localidad" name="localidad">
          </div>
          <div class="form-field">
            <label for="c-email">Email *</label>
            <input type="email" id="c-email" name="email" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="c-telefono">Teléfono *</label>
            <input type="tel" id="c-telefono" name="telefono" required>
          </div>
          <div class="form-field">
            <label for="c-celular">Celular</label>
            <input type="tel" id="c-celular" name="celular">
          </div>
        </div>

        <h3 class="form-subheading">Datos del evento</h3>
        <div class="form-row">
          <div class="form-field">
            <label for="c-tipo">Tipo de evento</label>
            <select id="c-tipo" name="tipo_evento">
              <option value="Boda">Boda</option>
              <option value="15 años">15 años</option>
              <option value="Comunión">Comunión</option>
              <option value="Bar/Bat Mitzva">Bar/Bat Mitzva</option>
              <option value="Aniversario">Aniversario</option>
              <option value="Egreso/Graduación">Egreso/Graduación</option>
              <option value="Empresarial">Empresarial</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="form-field">
            <label for="c-fecha">Fecha *</label>
            <input type="text" id="c-fecha" name="fecha_evento" placeholder="dd/mm/aaaa" required>
          </div>
          <div class="form-field">
            <label for="c-pax">Cantidad de invitados *</label>
            <input type="number" id="c-pax" name="cantidad_invitados" min="1" required>
          </div>
        </div>
        <div class="form-field">
          <label for="c-comentarios">Información suplementaria</label>
          <textarea id="c-comentarios" name="comentarios" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enviar consulta</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <p class="footer-brand" id="footer-brand"></p>
    <p class="footer-contact" id="footer-contact"></p>
    <ul class="social-row" id="social-row"></ul>
    <p class="copyright"><span id="footer-text"></span> · <span id="footer-year"></span></p>
  </div>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">&#8249;</button>
  <img id="lightbox-img" src="" alt="">

</div>

<script src="/js/config.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
