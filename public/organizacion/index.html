<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leprett — Organización de Eventos</title>
<meta name="description" content="Organización integral de tu evento social o corporativo, de la mano de Salones Leprett.">
<link rel="canonical" href="https://organizacion.salonesleprett.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="#top" class="nav-brand" id="nav-brand">Leprett — Organización</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="#top" data-nav-label="nav_home_label">Inicio</a></li>
      <li><a href="#nosotros" data-nav-label="nav_nosotros_label">Nosotros</a></li>
      <li><a href="#servicios" data-nav-label="nav_servicios_label">Servicios</a></li>
      <li><a href="#imagenes" data-nav-label="nav_imagenes_label">Imágenes</a></li>
      <li><a href="#footer" data-nav-label="nav_telefono_label">Teléfono</a></li>
      <li><a href="#contacto" data-nav-label="nav_contacto_label" class="nav-cta">Contacto</a></li>
    </ul>
  </div>
</nav>

<header class="hero" id="top">
  <div class="hero-media">
    <img id="banner-image" src="" alt="Organización de Eventos" class="hero-img" hidden>
    <div class="hero-veil"></div>
  </div>
  <div class="hero-content">
    <p class="eyebrow">Organización de Eventos</p>
    <h1 id="banner-title" class="hero-title"></h1>
    <p id="banner-subtitle" class="hero-subtitle"></p>
    <a href="#contacto" class="btn btn-primary">Consultar</a>
  </div>
</header>

<main>

  <section id="nosotros" class="section">
    <div class="section-inner bio-grid">
      <div class="bio-photo">
        <img id="nosotros-image" src="" alt="Organización de Eventos" hidden>
      </div>
      <div class="bio-copy">
        <p class="kicker" id="nosotros-subheading"></p>
        <h2 class="section-title" id="nosotros-heading"></h2>
        <div class="prose" id="nosotros-text"></div>
      </div>
    </div>
  </section>

  <section id="servicios" class="section section-alt">
    <div class="section-inner">
      <div class="section-header centered">
        <p class="kicker" id="servicios-subheading"></p>
        <h2 class="section-title" id="servicios-heading"></h2>
      </div>
      <div class="servicios-list" id="servicios-list"></div>
    </div>
  </section>

  <section id="imagenes" class="section">
    <div class="section-inner">
      <div class="section-header centered">
        <p class="kicker" id="imagenes-subheading"></p>
        <h2 class="section-title" id="imagenes-heading"></h2>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <section id="contacto" class="section section-alt">
    <div class="section-inner">
      <div class="section-header centered">
        <p class="kicker" id="contact-subheading"></p>
        <h2 class="section-title" id="contact-heading"></h2>
      </div>

      <form id="contact-form" class="contact-form" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label for="f-name">Nombre *</label>
            <input type="text" id="f-name" name="name" required>
          </div>
          <div class="form-field">
            <label for="f-email">Email *</label>
            <input type="email" id="f-email" name="email" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="f-phone">Teléfono</label>
            <input type="tel" id="f-phone" name="phone">
          </div>
        </div>
        <div class="form-field">
          <label for="f-message">Contanos sobre tu evento *</label>
          <textarea id="f-message" name="message" rows="5" required></textarea>
        </div>
        <!-- Honeypot anti-spam: oculto por CSS, invisible para personas -->
        <div class="hp-field" aria-hidden="true">
          <label for="f-website">No completar</label>
          <input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </section>

</main>

<footer class="footer" id="footer">
  <div class="footer-inner">
    <p class="footer-brand" id="footer-brand"></p>
    <p class="footer-contact" id="footer-contact"></p>
    <p class="copyright"><span id="footer-text"></span> · <span id="footer-year"></span> · <a href="https://frontyback.com" target="_blank" rel="noopener" style="text-decoration:underline;">by FrontyBack</a></p>
  </div>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">&#8249;</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">&#8250;</button>
</div>

<script src="/js/config.js?v=4"></script>
<script src="/organizacion/main.js?v=1"></script>
</body>
</html>
